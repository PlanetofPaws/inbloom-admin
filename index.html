<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山花 in(BLOOM) ｜ 後台管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EE;
  --surface:#F4EEE1;
  --surface-2:#ECE3CF;
  --white:#FFFDF8;
  --ink:#2A2520;
  --ink-soft:#6B6155;
  --ink-faint:#9A8F7E;
  --accent:#8C4A3F;
  --accent-dark:#6E362D;
  --accent-tint:#F1DFD8;
  --sage:#5F7350;
  --sage-tint:#E2E8D6;
  --amber:#A97423;
  --amber-tint:#F4E6C8;
  --danger:#A8433A;
  --danger-tint:#F3DAD6;
  --border:#DFD3B8;
  --border-soft:#EAE1CB;
  --shadow: 0 1px 2px rgba(42,37,32,0.06), 0 6px 20px rgba(42,37,32,0.05);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Fraunces',serif;}

/* ---------- header ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1180px; margin:0 auto;
  padding:18px 20px 0 20px;
}
.brand{
  display:flex; align-items:baseline; gap:10px; margin-bottom:14px;
}
.brand-mark{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:26px;
  color:var(--accent-dark);
  letter-spacing:0.01em;
}
.brand-sub{
  font-size:13px;
  color:var(--ink-faint);
  letter-spacing:0.04em;
}
.brand-right{
  margin-left:auto;
  font-size:12.5px;
  color:var(--ink-faint);
  text-align:right;
}
.brand-row{display:flex;align-items:flex-end;}

.tabs{
  display:flex; gap:4px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:0;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;
  padding:10px 16px 12px 16px;
  font-size:14.5px;
  color:var(--ink-soft);
  border:none; background:none; cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;
  font-family:inherit;
  transition:color .15s ease, border-color .15s ease;
}
.tab:hover{color:var(--ink);}
.tab.active{
  color:var(--accent-dark);
  border-bottom:2px solid var(--accent);
  font-weight:600;
}

/* ---------- layout ---------- */
.main{
  max-width:1180px; margin:0 auto;
  padding:26px 20px 80px 20px;
}
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:16px; margin-bottom:18px; flex-wrap:wrap;
}
.section-title{
  font-family:'Fraunces',serif; font-weight:500;
  font-size:22px; color:var(--ink);
}
.section-desc{
  font-size:13.5px; color:var(--ink-faint); margin-top:3px;
}

.grid{
  display:grid; gap:14px;
}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:560px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
}

.card{
  background:var(--white);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:18px 20px;
  box-shadow:var(--shadow);
}
.stat-card .stat-label{
  font-size:12.5px; color:var(--ink-faint); margin-bottom:8px;
  display:flex; align-items:center; gap:6px;
}
.stat-card .stat-value{
  font-family:'Fraunces',serif; font-size:30px; font-weight:500;
  color:var(--ink);
}
.stat-card .stat-value.warn{color:var(--danger);}
.stat-card .stat-note{font-size:12.5px; color:var(--ink-faint); margin-top:6px;}

/* ---------- alert list ---------- */
.alert-card{margin-bottom:22px;}
.alert-title{
  font-size:13.5px; font-weight:600; color:var(--accent-dark);
  margin-bottom:10px; display:flex; align-items:center; gap:6px;
}
.alert-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 0; border-top:1px solid var(--border-soft);
  font-size:14px;
}
.alert-row:first-of-type{border-top:none;}
.alert-name{color:var(--ink);}
.alert-meta{color:var(--ink-faint); font-size:12.5px;}
.pill{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px; border-radius:100px;
  font-size:12px; font-weight:500;
}
.pill-ok{background:var(--sage-tint); color:var(--sage);}
.pill-warn{background:var(--amber-tint); color:var(--amber);}
.pill-danger{background:var(--danger-tint); color:var(--danger);}
.pill-muted{background:var(--surface-2); color:var(--ink-faint);}

/* ---------- table ---------- */
.table-wrap{
  background:var(--white); border:1px solid var(--border-soft);
  border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
}
table{width:100%; border-collapse:collapse; font-size:13.8px;}
thead th{
  text-align:left; font-weight:600; color:var(--ink-soft);
  font-size:12px; letter-spacing:0.02em;
  padding:11px 14px; background:var(--surface);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{
  padding:11px 14px; border-bottom:1px solid var(--border-soft);
  vertical-align:middle;
  color:var(--ink);
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FBF8F1;}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums;}
.group-row td{
  background:var(--surface); font-weight:600; color:var(--accent-dark);
  font-size:12.5px; padding:8px 14px;
}
.mono{font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-faint);}
.item-name{font-weight:500;}
.item-code{font-size:12px; color:var(--ink-faint);}

/* editable input in table */
.edit-input{
  width:72px; padding:5px 7px; font-size:13.5px;
  border:1px solid var(--border); border-radius:6px;
  background:var(--bg); color:var(--ink);
  font-family:inherit; text-align:right;
}
.edit-input:focus{outline:none; border-color:var(--accent); background:var(--white);}
.edit-input.price{width:64px;}

/* ---------- buttons ---------- */
.btn{
  font-family:inherit; font-size:13.5px; font-weight:500;
  padding:7px 14px; border-radius:7px; border:1px solid var(--border);
  background:var(--white); color:var(--ink); cursor:pointer;
  transition:all .12s ease;
}
.btn:hover{border-color:var(--ink-faint);}
.btn-accent{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-accent:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
.btn-sm{padding:5px 10px; font-size:12.5px; border-radius:6px;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--accent-dark);}
.btn-ghost:hover{background:var(--accent-tint);}
.btn-ghost.danger{color:var(--danger);}
.btn-ghost.danger:hover{background:var(--danger-tint);}
.action-row{display:flex; gap:8px; align-items:center;}
.qty-input{
  width:56px; padding:5px 7px; border:1px solid var(--border);
  border-radius:6px; font-size:13.5px; text-align:center; font-family:inherit;
  background:var(--bg);
}
.qty-input:focus{outline:none; border-color:var(--accent); background:var(--white);}

/* ---------- toast ---------- */
#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--bg);
  padding:11px 20px; border-radius:8px; font-size:13.5px;
  opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.2);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- menu / drink cards ---------- */
.drink-card{
  background:var(--white); border:1px solid var(--border-soft);
  border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);
}
.drink-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
.drink-title{font-family:'Fraunces',serif; font-size:16.5px; font-weight:500; color:var(--ink);}
.drink-series{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.drink-margin{font-size:12px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap;}
.margin-good{background:var(--sage-tint); color:var(--sage);}
.margin-mid{background:var(--amber-tint); color:var(--amber);}
.margin-low{background:var(--danger-tint); color:var(--danger);}
.margin-none{background:var(--surface-2); color:var(--ink-faint);}
.ingredient-list{font-size:12.5px; color:var(--ink-soft); margin:10px 0; line-height:1.7;}
.ingredient-list span{color:var(--ink-faint);}
.drink-nums{
  display:flex; justify-content:space-between; align-items:center;
  border-top:1px solid var(--border-soft); padding-top:10px; margin-top:4px;
  font-size:13px;
}
.drink-nums .cost{color:var(--ink-faint);}
.price-edit{display:flex; align-items:center; gap:4px;}
.price-edit input{
  width:60px; padding:4px 6px; border:1px solid var(--border); border-radius:6px;
  font-family:inherit; font-size:13.5px; text-align:right; background:var(--bg);
}

/* section divider label */
.series-label{
  font-size:12.5px; font-weight:600; color:var(--accent-dark);
  margin:26px 0 10px 0; padding-bottom:6px; border-bottom:1px solid var(--border);
  text-transform:none;
}
.series-label:first-child{margin-top:0;}

.empty-note{
  font-size:13px; color:var(--ink-faint); padding:30px 0; text-align:center;
}

/* ---------- new: clickable stat card ---------- */
.stat-card.clickable{cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
.stat-card.clickable:hover{transform:translateY(-2px); box-shadow:0 4px 14px rgba(42,37,32,0.10), 0 10px 26px rgba(42,37,32,0.07);}

/* ---------- material name link + tag ---------- */
.link-name{
  background:none; border:none; padding:0; margin:0; font:inherit; cursor:pointer;
  color:var(--ink); font-weight:500; text-align:left;
  border-bottom:1px dotted var(--ink-faint);
}
.link-name:hover{color:var(--accent-dark); border-bottom-color:var(--accent);}
.tiny-tag{
  display:inline-block; margin-left:6px; font-size:10.5px; padding:1px 6px;
  border-radius:100px; background:var(--surface-2); color:var(--ink-faint);
}

/* ---------- form card (add material / add drink) ---------- */
.form-card{margin-bottom:16px;}
.form-title{font-weight:600; font-size:14px; color:var(--ink); margin-bottom:10px;}
.form-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
}
@media(max-width:700px){.form-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.form-grid{grid-template-columns:1fr;}}
.form-grid label{
  display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--ink-soft);
}
.form-grid input, .form-grid select{
  padding:7px 9px; border:1px solid var(--border); border-radius:7px;
  font-family:inherit; font-size:13.5px; background:var(--bg); color:var(--ink);
}
.form-grid input:focus, .form-grid select:focus{outline:none; border-color:var(--accent); background:var(--white);}

/* ---------- ingredient input rows (add drink) ---------- */
.ing-input-row{
  display:grid; grid-template-columns:2fr 1fr 90px auto; gap:8px; margin-bottom:8px; align-items:center;
}
.ing-input-row input, .ing-input-row select{
  padding:7px 9px; border:1px solid var(--border); border-radius:7px;
  font-family:inherit; font-size:13.5px; background:var(--bg); color:var(--ink);
}
.ing-row{display:flex; justify-content:space-between; gap:8px;}
.ing-cost{color:var(--ink-faint); font-variant-numeric:tabular-nums;}

/* ---------- modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(42,37,32,0.35);
  display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
}
.modal-card{
  background:var(--white); border-radius:14px; padding:22px 24px;
  max-width:400px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.25);
}
.modal-title{font-family:'Fraunces',serif; font-size:18px; font-weight:500; margin-bottom:4px;}
.modal-sub{font-size:12.5px; color:var(--ink-faint); margin-bottom:14px;}
.modal-row{
  display:flex; justify-content:space-between; gap:12px; padding:8px 0;
  border-top:1px solid var(--border-soft); font-size:13.5px;
}
.modal-row:first-of-type{border-top:none;}
.modal-row span:first-child{color:var(--ink-faint);}
.modal-form-block{margin-top:14px; padding-top:12px; border-top:1px solid var(--border-soft);}
.modal-block-title{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; font-weight:600;}

/* ---------- quick log cards (異動紀錄) ---------- */
.quick-log-card{display:flex; flex-direction:column; gap:7px;}
.quick-log-title{font-size:11.5px; color:var(--ink-faint);}
.quick-log-big{font-family:'Fraunces',serif; font-size:19px; font-weight:500; margin-bottom:4px; color:var(--ink);}
.edit-input.full{width:100%;}
.btn.full{width:100%; text-align:center;}

/* ---------- category chips ---------- */
.chip-row{
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;
}
.chip{
  font-family:inherit; font-size:12.5px; padding:6px 13px; border-radius:100px;
  border:1px solid var(--border); background:var(--white); color:var(--ink-soft); cursor:pointer;
  transition:all .12s ease;
}
.chip:hover{border-color:var(--accent);}
.chip-active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500;}
.modal-wide{max-width:560px;}

footer.appfoot{
  text-align:center; color:var(--ink-faint); font-size:12px;
  padding:30px 0 10px 0;
}

</style>

let state = null;
let currentTab = 'dashboard';
let materialsFilter = null;   // 'low' | null
let packagedFilter = null;    // 'low' | null
let showHiddenMaterials = false;
let showHiddenPackaged = false;
let showHiddenDrinks = false;
// Data lives in the same Google Apps Script project as this page (server
// functions getStateForClient() / saveStateForClient() in Code.gs), reached
// via google.script.run -- Apps Script's native client<->server bridge.
// This page is only reachable by a Google account on the server-side
// allowlist, so no separate login screen is needed here.

// True whenever `state` is NOT confirmed to be the real data from the
// Google Sheet (e.g. the initial GET failed, or a later re-sync failed).
// saveState() refuses to write to the backend while this is true, because
// writing here would overwrite the sheet's real data with stale/seed data
// -- this is what previously caused "my edits disappeared".
let usingFallbackData = false;

function fetchBackend(retries){
  return new Promise((resolve, reject)=>{
    let attempts = 0;
    function tryOnce(){
      google.script.run
        .withSuccessHandler(data=>{
          if(data && Array.isArray(data.materials)) resolve(data);
          else attemptRetry(new Error('unexpected response shape'));
        })
        .withFailureHandler(err=>attemptRetry(err))
        .getStateForClient();
    }
    function attemptRetry(err){
      attempts++;
      if(attempts <= retries) setTimeout(tryOnce, 500);
      else reject(err);
    }
    tryOnce();
  });
}

async function initDb(){
  try{
    state = await fetchBackend(1);
    usingFallbackData = false;
  }catch(e){
    state = SEED_STATE;
    usingFallbackData = true;
    showToast('無法連線到試算表，暫時顯示預設資料（此畫面上的變更暫不會儲存，請重新整理後再試）');
  }
  render();
}

let saveTimer = null;
function saveState(){
  return new Promise((resolve)=>{
    if(usingFallbackData){
      // Refuse to save: state isn't confirmed to be the real sheet data,
      // so saving now would overwrite the sheet with stale/seed data.
      showToast('尚未連上試算表，這個變更沒有儲存，請重新整理頁面後再試一次');
      resolve();
      return;
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      google.script.run
        .withSuccessHandler(result=>{
          if(!result || result.status !== 'ok'){
            showToast('儲存失敗，變更僅暫存在畫面上，請檢查網路連線後重新整理再試一次');
          }
          resolve();
        })
        .withFailureHandler(()=>{
          showToast('儲存失敗，變更僅暫存在畫面上，請檢查網路連線後重新整理再試一次');
          resolve();
        })
        .saveStateForClient(state);
    }, 350);
  });
}

// ---------- utils ----------
function fmt(n, d=2){
  if(n === null || n === undefined || isNaN(n)) return '—';
  const r = Math.round(n * Math.pow(10,d)) / Math.pow(10,d);
  return r.toLocaleString('zh-Hant', {minimumFractionDigits: (r%1===0? 0:Math.min(d,2)), maximumFractionDigits:d});
}
function fmtMoney(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return '$' + fmt(n,2);
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowStamp(){
  const d = new Date();
  const date = todayISO();
  const time = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return {date, time, sort: d.getTime()};
}
function monthKey(iso){ return iso.slice(0,7); }
function findMaterial(name){ return state.materials.find(m=>m.name===name); }
function findPackaged(code){ return state.packaged.find(p=>p.code===code); }
function findLinkedPackaged(drinkTitle){ return state.packaged.find(p=>p.drink_title===drinkTitle || p.code===drinkTitle); }
function findLinkedDrink(packagedItem){ return state.drinks.find(d=>d.title===packagedItem.drink_title || d.title===packagedItem.code); }

function materialStatus(m){
  if(m.stock === null || m.stock === undefined) return {label:'尚未填寫', cls:'pill-muted'};
  if(m.safety_stock === null || m.safety_stock === undefined || m.safety_stock === 0){
    return {label:'✅ 正常', cls:'pill-ok'};
  }
  if(m.stock <= m.safety_stock) return {label:'⚠️ 需補貨', cls:'pill-warn'};
  return {label:'✅ 正常', cls:'pill-ok'};
}
function isMaterialLow(m){
  return !!(m.safety_stock && m.stock !== null && m.stock <= m.safety_stock);
}
function packagedCurrentStock(p){
  return (p.initial_stock||0) + (p.packaged_total||0) - (p.sold_total||0) - (p.scrapped_total||0);
}
function packagedStatus(p){
  const cur = packagedCurrentStock(p);
  if(!p.safety_stock) return {label:'✅ 正常', cls:'pill-ok'};
  if(cur <= p.safety_stock) return {label:'⚠️ 需補貨', cls:'pill-warn'};
  return {label:'✅ 正常', cls:'pill-ok'};
}
function isPackagedLow(p){
  return !!(p.safety_stock && packagedCurrentStock(p) <= p.safety_stock);
}

function computePackCost(){
  return state.materials.filter(m=>m.category==='包材類').reduce((s,m)=> s + (m.unit_price||0), 0);
}
function ingredientGrams(ing){
  const m = findMaterial(ing.name);
  if(ing.unit === '匙' && m && m.per_spoon_g){
    return ing.amount * m.per_spoon_g;
  }
  return ing.amount;
}
function ingredientCost(ing){
  const m = findMaterial(ing.name);
  const grams = ingredientGrams(ing);
  const price = m ? (m.unit_price||0) : 0;
  return grams * price;
}
function computeDrinkCost(drink){
  const packcost = computePackCost();
  let matcost = 0;
  drink.ingredients.forEach(ing=>{ matcost += ingredientCost(ing); });
  const total = packcost + matcost;
  const price = drink.price;
  const margin = (price && price>0) ? (price-total)/price : null;
  return {packcost, matcost, total, price, margin};
}
function marginClass(margin){
  if(margin === null || margin === undefined) return 'margin-none';
  if(margin >= 0.7) return 'margin-good';
  if(margin >= 0.6) return 'margin-mid';
  return 'margin-low';
}
function marginLabel(margin){
  if(margin === null || margin === undefined) return '尚未定價';
  return (margin*100).toFixed(1) + '%';
}
function operatingStatus(margin){
  if(margin === null || margin === undefined) return {label:'—', cls:'pill-muted'};
  if(margin >= 0.7) return {label:'🟢 理想', cls:'pill-ok'};
  if(margin >= 0.6) return {label:'🟡 可接受', cls:'pill-warn'};
  return {label:'🔴 需檢視', cls:'pill-danger'};
}
function materialCategories(){
  return [...new Set(state.materials.map(m=>m.category).filter(Boolean))];
}
function drinkSeriesList(){
  return [...new Set(state.drinks.map(d=>d.series).filter(Boolean))];
}
function recipeFromIngredients(ingredients){
  const recipe = {};
  ingredients.forEach(ing=>{
    const grams = ingredientGrams(ing);
    recipe[ing.name] = (recipe[ing.name]||0) + grams;
  });
  return recipe;
}
function monthlyPurchaseCost(){
  const mk = monthKey(todayISO());
  return state.material_log
    .filter(l=>l.type==='入庫' && monthKey(l.date)===mk)
    .reduce((s,l)=>s + (l.qty * (l.unit_price_snapshot||0)), 0);
}
function logMaterialMovement(material, type, qty, resultingStock, note){
  const stamp = nowStamp();
  const m = findMaterial(material);
  state.material_log.unshift({
    date: stamp.date, time: stamp.time, sort: stamp.sort,
    material, type, qty, resulting_stock: resultingStock,
    unit_price_snapshot: m ? (m.unit_price||0) : 0,
    note: note || '',
  });
  if(state.material_log.length > 400){
    state.material_log = state.material_log.slice(0, 400);
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}


// ---------- actions ----------
async function actionRestock(materialName, amount, note){
  const m = findMaterial(materialName);
  if(!m || !amount) return;
  amount = Math.abs(amount);
  m.stock = (m.stock || 0) + amount;
  logMaterialMovement(materialName, '入庫', amount, m.stock, note || '登記進貨');
  saveState();
  showToast(`${materialName} 已進貨 ${fmt(amount)} ${m.unit||''}`);
  render();
}
async function actionScrap(materialName, amount, note){
  const m = findMaterial(materialName);
  if(!m || !amount) return;
  amount = Math.abs(amount);
  m.stock = (m.stock || 0) - amount;
  logMaterialMovement(materialName, '報廢', -amount, m.stock, note || '報廢');
  saveState();
  showToast(`${materialName} 已報廢 ${fmt(amount)} ${m.unit||''}`);
  render();
}
async function actionAdjust(materialName, newValue, note){
  const m = findMaterial(materialName);
  if(!m || newValue===null || isNaN(newValue)) return;
  newValue = Math.max(0, newValue);
  const delta = newValue - (m.stock||0);
  m.stock = newValue;
  logMaterialMovement(materialName, '調整', delta, m.stock, note || '庫存調整');
  saveState();
  showToast(`${materialName} 庫存已調整為 ${fmt(newValue)} ${m.unit||''}`);
  render();
}
async function actionManualOut(materialName, amount, note){
  const m = findMaterial(materialName);
  if(!m || !amount) return;
  amount = Math.abs(amount);
  m.stock = (m.stock || 0) - amount;
  logMaterialMovement(materialName, '出庫', -amount, m.stock, note || '出庫');
  saveState();
  showToast(`${materialName} 已出庫 ${fmt(amount)} ${m.unit||''}`);
  render();
}
async function actionSetSafety(materialName, val){

}
async function actionUpdateMaterialInfo(materialName, updates){

async function actionSetMaterialStock(materialName, val){

async function actionToggleHideMaterial(materialName){

async function actionAddMaterial(data){
  if(state.materials.some(m=>m.name===data.name)){
    showToast('已經有同名的原料了');
    return false;
  }
  state.materials.push({
    category: data.category || '其他', name: data.name, unit: data.unit || 'g',
    unit_price: data.unit_price || 0, per_spoon_g: data.per_spoon_g || 0,
    used_items: [], stock: data.stock || 0, safety_stock: data.safety_stock || 0,
    vendor: data.vendor || '', spec: data.spec || '', origin: data.origin || '',
    note: '', hidden:false,
  });
  saveState();
  showToast(`已新增原料「${data.name}」`);
  return true;
}

async function actionPackage(code, qty){
  const p = findPackaged(code);
  if(!p || !qty) return;
  qty = Math.abs(qty);
  p.packaged_total = (p.packaged_total||0) + qty;
  let shortages = [];
  Object.entries(p.recipe_per_packet).forEach(([matName, gramsPer])=>{
    const m = findMaterial(matName);
    if(m){
      const used = gramsPer*qty;
      m.stock = (m.stock||0) - used;
      logMaterialMovement(matName, '出庫', -used, m.stock, `包裝「${p.name}」×${qty}`);
      if(m.stock < 0) shortages.push(matName);
    }
  });
  saveState();
  if(shortages.length){
    showToast(`已記錄包裝 ${qty} 份，但 ${shortages.join('、')} 庫存已變成負數，請確認`);
  }else{
    showToast(`${p.name} 今日包裝 +${qty}`);
  }
  render();
}
async function actionSell(code, qty){
  const p = findPackaged(code);
  if(!p || !qty) return;
  qty = Math.abs(qty);
  p.sold_total = (p.sold_total||0) + qty;
  saveState();
  showToast(`${p.name} 已扣除使用/售出 ${qty}`);
  render();
}
async function actionSetPackagedSafety(code, val){
  const p = findPackaged(code);
  if(!p) return;
  p.safety_stock = val;
  saveState();
}
async function actionScrapPackaged(code, qty, note){
  const p = findPackaged(code);
  if(!p || !qty) return;
  qty = Math.abs(qty);
  p.scrapped_total = (p.scrapped_total||0) + qty;
  const stamp = nowStamp();
  state.packaged_log.unshift({date:stamp.date, time:stamp.time, code, name:p.name, type:'報廢', qty:-qty, note: note||''});
  saveState();
  showToast(`${p.name} 已報廢 ${fmt(qty)}`);
  render();
}
// 直接把商品庫存「設定」成某個數字，用於盤點或校正錯誤登記。
// 跟「今日包裝」不同，這個動作完全不會連動扣原料 -- 差額只會加/減在
// initial_stock 上，packaged_total／sold_total／scrapped_total（累計包裝
// ／使用／報廢）維持不變，報表數字不會被打亂。
async function actionAdjustPackagedStock(code, newValue, note){
  const p = findPackaged(code);
  if(!p || newValue === null || isNaN(newValue) || newValue < 0) return;
  const cur = packagedCurrentStock(p);
  const delta = newValue - cur;
  if(delta === 0) return;
  p.initial_stock = (p.initial_stock||0) + delta;
  const stamp = nowStamp();
  state.packaged_log.unshift({date:stamp.date, time:stamp.time, code, name:p.name, type:'調整', qty:delta, note: note || '設定庫存（不影響原料）'});
  saveState();
  showToast(`${p.name} 庫存已設定為 ${fmt(newValue)}`);
  render();
}
async function actionSetPrice(title, val){
  const d = state.drinks.find(x=>x.title===title);
  if(!d) return;
  d.price = val;
  saveState();
}
async function actionUpdateDrinkIngredients(title, newIngredients){
  const d = state.drinks.find(x=>x.title===title);
  if(!d) return;
  d.ingredients = newIngredients;
  const p = state.packaged.find(x=>x.drink_title===title || x.code===title);
  if(p){
    p.recipe_per_packet = recipeFromIngredients(newIngredients);
  }
  saveState();
  showToast(`「${title}」配方已更新`);
  render();
}
async function actionRenameDrink(oldTitle, newTitle){
  newTitle = (newTitle||'').trim();
  if(!newTitle){ showToast('請輸入名稱'); return; }
  if(newTitle === oldTitle) return;
  if(state.drinks.some(x=>x.title===newTitle)){ showToast('已經有同名的飲品了'); return; }
  const d = state.drinks.find(x=>x.title===oldTitle);
  if(!d) return;
  d.title = newTitle;
  const p = findLinkedPackaged(oldTitle);
  if(p){
    p.name = newTitle;
    p.drink_title = newTitle;
    // p.code is left unchanged on purpose -- it's the item's permanent
    // internal ID, and changing it would break the 今日包裝/今日使用/報廢
    // buttons for this row mid-edit. The display name is what updates.
  }
  uiState.drinkEditModal = newTitle;
  saveState();
  showToast(`已改名為「${newTitle}」`);
  render();
}
async function actionAddDrink(data){
  if(state.drinks.some(d=>d.title===data.title)){
    showToast('已經有同名的飲品了');
    return false;
  }
  const drink = {
    title: data.title, series: data.series || '其他',
    ingredients: data.ingredients, price: data.price || null, hidden: false,
  };
  state.drinks.push(drink);
  // auto-sync into 商品庫存
  const code = data.code || data.title;
  if(!findPackaged(code)){
    state.packaged.push({
      code: code, name: data.title, series: drink.series, drink_title: data.title,
      initial_stock: 0, safety_stock: 0, packaged_total: 0, sold_total: 0, scrapped_total: 0,
      recipe_per_packet: recipeFromIngredients(data.ingredients), hidden: false,
    });
    saveState();
    showToast(`已新增飲品「${data.title}」，並同步到商品庫存`);
  }else{
    saveState();
    showToast(`已新增飲品「${data.title}」，但商品代號「${code}」已經有商品在用，商品庫存沒有新增對應項目，請改用其他代號`);
  }
  return true;
}

// ---------- rendering ----------
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderDashboard(){
  const lowMaterials = state.materials.filter(isMaterialLow);
  const lowPackaged = state.packaged.filter(isPackagedLow);

  const avgMargin = (()=>{
    const margins = state.drinks.map(d=>computeDrinkCost(d).margin).filter(x=>x!==null);
    if(!margins.length) return null;
    return margins.reduce((a,b)=>a+b,0)/margins.length;
  })();
  const monthCost = monthlyPurchaseCost();
  const mk = monthKey(todayISO());
  const monthLabel = mk.split('-')[0]+'年'+parseInt(mk.split('-')[1])+'月';

  return `

      <div class="card stat-card clickable" data-nav="low-materials">

        <div class="stat-value ${lowMaterials.length?'warn':''}">${lowMaterials.length}</div>

      <div class="card stat-card">
        <div class="stat-label">平均毛利率</div>
        <div class="stat-value">${avgMargin!==null ? (avgMargin*100).toFixed(1)+'%' : '—'}</div>

let categoryFilter = null;
let drinkCategoryFilter = null;
let logFilter = 'all';
let logSearch = '';

function renderLog(){
  const typeMap = {all:'全部', '入庫':'入庫', '出庫':'出庫', '報廢':'報廢', '調整':'調整'};
  let entries = state.material_log;
  if(logFilter !== 'all') entries = entries.filter(l=>l.type===logFilter);
  if(logSearch.trim()){
    const q = logSearch.trim();
    entries = entries.filter(l=> l.material.includes(q) || (l.note||'').includes(q));
  }
  const typeCls = {'入庫':'pill-ok','出庫':'pill-muted','報廢':'pill-danger','調整':'pill-warn'};

  let rows = '';
  if(!entries.length){
    rows = `<tr><td colspan="6" class="empty-note">還沒有異動紀錄</td></tr>`;
  }
  entries.slice(0,200).forEach(l=>{
    const sign = l.qty>0 ? '+' : '';
    rows += `<tr>
      <td class="muted">${esc(l.date)} ${esc(l.time||'')}</td>
      <td class="item-name">${esc(l.material)}</td>
      <td><span class="pill ${typeCls[l.type]||'pill-muted'}">${esc(l.type)}</span></td>
      <td class="num mono">${sign}${fmt(l.qty)}</td>
      <td class="num mono">${fmt(l.resulting_stock)}</td>
      <td class="muted">${esc(l.note||'')}</td>
    </tr>`;
  });

  const matOptions = state.materials.map(m=>`<option value="${esc(m.name)}">`).join('');

  return `
    <div class="section-head">
      <div>
        <div class="section-title">異動紀錄</div>
        <div class="section-desc">進貨、出庫、報廢、調整都已經整合到原料庫存的操作按鈕裡；這裡是完整歷史紀錄</div>
      </div>
    </div>
    <datalist id="log-mat-list">${matOptions}</datalist>
    <div class="action-row" style="margin-bottom:14px; flex-wrap:wrap;">
      ${Object.entries(typeMap).map(([k,label])=>`<button class="btn btn-sm ${logFilter===k?'btn-accent':''}" data-action="log-filter" data-type="${k}">${label}</button>`).join('')}
      <input class="edit-input" style="width:160px;" id="log-search" placeholder="搜尋材料、備註…" value="${esc(logSearch)}">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>日期</th><th>材料</th><th>異動類型</th><th class="num">數量</th><th class="num">異動後庫存</th><th>備註</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function render(){
  document.querySelector('.tabs').innerHTML = renderTabs();
  const fb = document.getElementById('fallback-banner');
  if(fb) fb.style.display = usingFallbackData ? '' : 'none';

  // Once a multi-field "add" form is open and mounted, later render() calls
  // (a background db sync echo, another action's re-render, etc.) must NOT
  // rebuild `.main` -- that would wipe whatever the user has already typed,
  // including any ingredient rows added via direct DOM manipulation below.
  // Only the very first render after opening (or a fresh tab load) mounts it.
  const skipMainRebuild =
    (currentTab==='materials' && uiState.addMaterialOpen && uiState._materialFormMounted) ||
    (currentTab==='menu' && uiState.addDrinkOpen && uiState._drinkFormMounted);

  if(!skipMainRebuild){
    document.querySelector('.main').innerHTML = renderMain();

    if(currentTab==='materials'){
      const holder = document.getElementById('add-material-form');
      if(holder){
        holder.innerHTML = uiState.addMaterialOpen ? renderAddMaterialForm() : '';
        uiState._materialFormMounted = uiState.addMaterialOpen;
      }
    }
    if(currentTab==='menu'){
      const holder = document.getElementById('add-drink-form');
      if(holder){
        holder.innerHTML = uiState.addDrinkOpen ? renderAddDrinkForm() : '';
        if(uiState.addDrinkOpen){
          const wrap = document.getElementById('nd-ingredients');
          wrap.innerHTML = '';
          for(let i=0;i<uiState.ingredientRows;i++){
            wrap.insertAdjacentHTML('beforeend', renderIngredientRow(i));
          }
        }
        uiState._drinkFormMounted = uiState.addDrinkOpen;
      }
    }
  }

  let modalHolder = document.getElementById('modal-root');
  if(!modalHolder){
    modalHolder = document.createElement('div');
    modalHolder.id = 'modal-root';
    document.body.appendChild(modalHolder);
  }
  if(uiState.materialEditModal){
    modalHolder.innerHTML = renderMaterialEditModal(uiState.materialEditModal);
  }else if(uiState.scrapModal){
    modalHolder.innerHTML = renderScrapModal(uiState.scrapModal);
  }else if(uiState.pkgScrapModal){
    modalHolder.innerHTML = renderPackagedScrapModal(uiState.pkgScrapModal);
  }else if(uiState.pkgAdjustModal){
    modalHolder.innerHTML = renderPackagedAdjustModal(uiState.pkgAdjustModal);
  }else if(uiState.drinkEditModal){
    modalHolder.innerHTML = renderDrinkEditModal(uiState.drinkEditModal);
  }else if(uiState.confirmModal){
    modalHolder.innerHTML = renderConfirmModal(uiState.confirmModal);
  }else{
    modalHolder.innerHTML = '';
  }
}


// ---------- excel export ----------
async function downloadWorkbook(wb, filename){
  try{
    const arrayBuf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
    const blob = new Blob([arrayBuf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    showToast('已匯出 Excel');
  }catch(err){
    showToast('匯出失敗，請再試一次');
  }
}

async function exportExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('匯出功能載入中，請稍後再試一次');
    return;
  }
  const wb = XLSX.utils.book_new();

  const matRows = [['分類','材料','廠商','產地','規格','單位','單價','目前庫存','安全庫存','庫存狀態','備註']];
  state.materials.forEach(m=>{
    matRows.push([m.category,m.name,m.vendor,m.origin,m.spec,m.unit,m.unit_price,
      m.stock===null?'':m.stock, m.safety_stock, materialStatus(m).label, m.note||'']);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(matRows);
  XLSX.utils.book_append_sheet(wb, ws1, '原料總表');

  const pkgRows = [['編號','品項','系列','目前庫存','安全庫存','累計已包裝','累計已使用','累計已報廢','庫存狀態']];
  state.packaged.forEach(p=>{
    pkgRows.push([p.code,p.name,p.series,packagedCurrentStock(p),p.safety_stock,p.packaged_total,p.sold_total,p.scrapped_total||0,packagedStatus(p).label]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(pkgRows);
  XLSX.utils.book_append_sheet(wb, ws2, '商品庫存');

  const ws3 = buildDrinksSheet();
  XLSX.utils.book_append_sheet(wb, ws3, '飲品總表');

  const logRows = [['日期','時間','材料','異動類型','數量','異動後庫存','備註']];
  state.material_log.forEach(l=>{
    logRows.push([l.date,l.time,l.material,l.type,l.qty,l.resulting_stock,l.note||'']);
  });
  const ws4 = XLSX.utils.aoa_to_sheet(logRows);
  XLSX.utils.book_append_sheet(wb, ws4, '異動紀錄');

  await downloadWorkbook(wb, `山花庫存總覽_${todayISO()}.xlsx`);
}

function buildDrinksSheet(){
  const drRows = [['系列','品項','原料成本','包材成本','總成本','售價','毛利金額','毛利率','經營狀態']];
  state.drinks.forEach(d=>{
    const c = computeDrinkCost(d);
    const marginAmount = (c.price!==null && c.price!==undefined) ? (c.price-c.total) : '';
    drRows.push([d.series||'', d.title, c.matcost.toFixed(2), c.packcost.toFixed(2), c.total.toFixed(2),
      d.price===null||d.price===undefined?'':d.price,
      marginAmount===''?'':marginAmount.toFixed(2),
      c.margin!==null?(c.margin*100).toFixed(1)+'%':'',
      operatingStatus(c.margin).label]);
  });
  return XLSX.utils.aoa_to_sheet(drRows);
}

async function exportDrinksExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('匯出功能載入中，請稍後再試一次');
    return;
  }
  const wb = XLSX.utils.book_new();
  const ws = buildDrinksSheet();
  XLSX.utils.book_append_sheet(wb, ws, '飲品總表');

  // also break out each drink's recipe on its own sheet-friendly block,
  // in one combined "配方明細" sheet so the whole cost picture is in one file
  const recipeRows = [['系列','品項','材料','用量','單位','材料成本']];
  state.drinks.forEach(d=>{
    d.ingredients.forEach(ing=>{
      recipeRows.push([d.series||'', d.title, ing.name, ing.amount, ing.unit||'', ingredientCost(ing).toFixed(2)]);
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet(recipeRows);
  XLSX.utils.book_append_sheet(wb, ws2, '配方明細');

  await downloadWorkbook(wb, `山花飲品總表_${todayISO()}.xlsx`);
}

// ---------- events ----------
function getVal(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function getNum(id){ const v = parseFloat(getVal(id)); return isNaN(v) ? null : v; }

function bindEvents(){
  document.body.addEventListener('click', (e)=>{
    const navBtn = e.target.closest('[data-nav]');
    if(navBtn){
      if(navBtn.dataset.nav==='low-materials') navigateToLowMaterials();
      else if(navBtn.dataset.nav==='low-packaged') navigateToLowPackaged();
      return;
    }
    const tabBtn = e.target.closest('[data-tab]');
    if(tabBtn){
      currentTab = tabBtn.dataset.tab;
      if(currentTab!=='materials') materialsFilter=null;
      if(currentTab!=='packaged') packagedFilter=null;
      uiState._materialFormMounted = false;
      uiState._drinkFormMounted = false;
      render();
      return;
    }
    const action = e.target.closest('[data-action]');
    if(!action) return;
    const act = action.dataset.action;

    if(act==='restock'){
      const name = action.dataset.name;
      const input = document.querySelector(`[data-restock-input="${CSS.escape(name)}"]`);
      const val = parseFloat(input.value);
      if(!val || val<=0){ showToast('請輸入大於 0 的進貨數量'); return; }
      actionRestock(name, val);
      input.value='';
    }
    else if(act==='pkg-add'){
      const code = action.dataset.code;
      const input = document.querySelector(`[data-pkg-input="${CSS.escape(code)}"]`);
      const val = parseFloat(input.value);
      if(!val || val<=0){ showToast('請輸入大於 0 的包裝數量'); return; }
      actionPackage(code, val);
      input.value='';
    }
    else if(act==='pkg-sell'){
      const code = action.dataset.code;
      const input = document.querySelector(`[data-pkg-input="${CSS.escape(code)}"]`);
      const val = parseFloat(input.value);
      if(!val || val<=0){ showToast('請輸入大於 0 的使用／售出數量'); return; }
      actionSell(code, val);
      input.value='';
    }
    else if(act==='toggle-hide'){
      actionToggleHideMaterial(action.dataset.name);
    }
    else if(act==='delete-material'){
      const name = action.dataset.name;
      const usedIn = state.drinks.filter(d=>d.ingredients.some(i=>i.name===name)).map(d=>d.title);
      const warn = usedIn.length ? `\n\n注意：這個材料還用在「${usedIn.join('、')}」的配方裡，刪除後那些飲品的成本會少算這一項。` : '';
      uiState.confirmModal = { message: `確定要刪除原料「${name}」嗎？此動作無法復原。${warn}`, run: ()=>actionDeleteMaterial(name) };
      render();
    }
    else if(act==='delete-drink'){
      const title = action.dataset.title;
      const linked = findLinkedPackaged(title);
      if(linked){
        uiState.confirmModal = {
          message: `確定要刪除飲品「${title}」嗎？此動作無法復原。\n\n商品庫存裡也有對應的「${linked.name}」，要一併刪除嗎？`,
          confirmLabel: '只刪除飲品',
          run: ()=>actionDeleteDrink(title),
          secondaryLabel: '一併刪除商品庫存項目',
          secondaryRun: ()=>{ actionDeleteDrink(title); actionDeletePackaged(linked.code); },
        };
      }else{
        uiState.confirmModal = { message: `確定要刪除飲品「${title}」嗎？此動作無法復原。`, run: ()=>actionDeleteDrink(title) };
      }
      render();
    }
    else if(act==='delete-packaged'){
      const code = action.dataset.code;
      const p = findPackaged(code);
      if(!p) return;
      const linked = findLinkedDrink(p);
      if(linked){
        uiState.confirmModal = {
          message: `確定要刪除商品「${p.name}」嗎？此動作無法復原。\n\n飲品總表裡也有對應的「${linked.title}」，要一併刪除嗎？`,
          confirmLabel: '只刪除商品',
          run: ()=>actionDeletePackaged(code),
          secondaryLabel: '一併刪除飲品總表項目',
          secondaryRun: ()=>{ actionDeletePackaged(code); actionDeleteDrink(linked.title); },
        };
      }else{
        uiState.confirmModal = { message: `確定要刪除商品「${p.name}」嗎？此動作無法復原。`, run: ()=>actionDeletePackaged(code) };
      }
      render();
    }
    else if(act==='toggle-hide-drink'){
      actionToggleHideDrink(action.dataset.title);
    }
    else if(act==='toggle-hide-packaged'){
      actionToggleHidePackaged(action.dataset.code);
    }
    else if(act==='toggle-show-hidden-drinks'){
      showHiddenDrinks = !showHiddenDrinks; render();
    }
    else if(act==='toggle-show-hidden-packaged'){
      showHiddenPackaged = !showHiddenPackaged; render();
    }
    else if(act==='close-confirm-modal'){
      uiState.confirmModal = null; render();
    }
    else if(act==='confirm-yes'){
      const cfg = uiState.confirmModal;
      uiState.confirmModal = null;
      if(cfg && typeof cfg.run === 'function') cfg.run();
      render();
    }
    else if(act==='confirm-secondary'){
      const cfg = uiState.confirmModal;
      uiState.confirmModal = null;
      if(cfg && typeof cfg.secondaryRun === 'function') cfg.secondaryRun();
      render();
    }
    else if(act==='toggle-show-hidden'){
      showHiddenMaterials = !showHiddenMaterials;
      render();
    }
    else if(act==='clear-materials-filter'){
      materialsFilter = null; showHiddenMaterials=false; render();
    }
    else if(act==='clear-packaged-filter'){
      packagedFilter = null; render();
    }
    else if(act==='export-excel'){
      exportExcel();
    }
    else if(act==='export-drinks-excel'){
      exportDrinksExcel();
    }
    else if(act==='open-add-material'){
      uiState.addMaterialOpen = true; render();
    }
    else if(act==='cancel-add-material'){
      uiState.addMaterialOpen = false; render();
    }
    else if(act==='submit-add-material'){
      const name = getVal('nm-name').trim();
      if(!name){ showToast('請輸入原料名稱'); return; }
      actionAddMaterial({
        name, category: getVal('nm-category').trim(), unit: getVal('nm-unit'),
        unit_price: getNum('nm-price')||0, per_spoon_g: getNum('nm-spoon')||0,
        vendor: getVal('nm-vendor').trim(), origin: getVal('nm-origin').trim(),
        spec: getVal('nm-spec').trim(), stock: getNum('nm-stock')||0, safety_stock: getNum('nm-safety')||0,
      }).then(ok=>{ if(ok){ uiState.addMaterialOpen=false; render(); } });
    }
    else if(act==='show-vendor' || act==='open-material-edit'){
      uiState.materialEditModal = action.dataset.name; render();
    }
    else if(act==='close-modal'){
      uiState.materialEditModal = null; render();
    }
    else if(act==='save-material-edit'){
      const name = action.dataset.name;
      actionUpdateMaterialInfo(name, {
        category: getVal('me-category').trim(), unit: getVal('me-unit'),
        unit_price: getNum('me-price')||0, per_spoon_g: getNum('me-spoon')||0,
        vendor: getVal('me-vendor').trim(), origin: getVal('me-origin').trim(),
        spec: getVal('me-spec').trim(),
      }).then(()=>{ uiState.materialEditModal=null; render(); });
    }
    else if(act==='cat-filter'){
      categoryFilter = action.dataset.cat || null; render();
    }
    else if(act==='drink-cat-filter'){
      drinkCategoryFilter = action.dataset.cat || null; render();
    }
    else if(act==='open-scrap'){
      uiState.scrapModal = action.dataset.name; render();
    }
    else if(act==='close-scrap-modal'){
      uiState.scrapModal = null; render();
    }
    else if(act==='submit-scrap'){
      const name = action.dataset.name;
      const qty = getNum('scrap-qty');
      if(!qty || qty<=0){ showToast('請輸入大於 0 的報廢數量'); return; }
      actionScrap(name, qty, getVal('scrap-note').trim()).then(()=>{ uiState.scrapModal=null; render(); });
    }
    else if(act==='submit-adjust'){
      const name = action.dataset.name;
      const qty = getNum('adjust-qty');
      if(qty===null || qty<0){ showToast('請輸入正確的庫存數量（不可為負數）'); return; }
      actionAdjust(name, qty, getVal('adjust-note').trim()).then(()=>{ uiState.scrapModal=null; render(); });
    }
    else if(act==='open-add-drink'){
      uiState.addDrinkOpen = true; uiState.ingredientRows = 1; render();
    }
    else if(act==='cancel-add-drink'){
      uiState.addDrinkOpen = false; render();
    }
    else if(act==='add-ingredient-row'){
      const wrap = document.getElementById('nd-ingredients');
      if(wrap) wrap.insertAdjacentHTML('beforeend', renderIngredientRow(wrap.querySelectorAll('.ing-input-row').length));
    }
    else if(act==='remove-ingredient-row'){
      const row = action.closest('.ing-input-row');
      if(row) row.remove();
    }
    else if(act==='submit-add-drink'){
      const title = getVal('nd-title').trim();
      if(!title){ showToast('請輸入品項名稱'); return; }
      const ingredients = [];
      document.querySelectorAll('#nd-ingredients .ing-input-row').forEach(row=>{
        const name = row.querySelector('.ing-name').value.trim();
        const amount = parseFloat(row.querySelector('.ing-amount').value);
        const unit = row.querySelector('.ing-unit').value;
        if(name && !isNaN(amount)) ingredients.push({name, amount, unit});
      });
      if(!ingredients.length){ showToast('請至少新增一項材料配方'); return; }
      actionAddDrink({
        title, series: getVal('nd-series').trim() || '其他',
        price: getNum('nd-price'), ingredients,
        code: getVal('nd-code').trim() || null,
      }).then(ok=>{ if(ok){ uiState.addDrinkOpen=false; render(); } });
    }
    else if(act==='open-pkg-scrap'){
      uiState.pkgScrapModal = action.dataset.code; render();
    }
    else if(act==='close-pkg-scrap-modal'){
      uiState.pkgScrapModal = null; render();
    }
    else if(act==='submit-pkg-scrap'){
      const code = action.dataset.code;
      const qty = getNum('pkg-scrap-qty');
      const note = getVal('pkg-scrap-note').trim();
      if(!qty || qty<=0){ showToast('請輸入大於 0 的報廢數量'); return; }
      if(!note){ showToast('請填寫報廢原因'); return; }
      actionScrapPackaged(code, qty, note).then(()=>{ uiState.pkgScrapModal=null; render(); });
    }
    else if(act==='open-pkg-adjust'){
      uiState.pkgAdjustModal = action.dataset.code; render();
    }
    else if(act==='close-pkg-adjust-modal'){
      uiState.pkgAdjustModal = null; render();
    }
    else if(act==='submit-pkg-adjust'){
      const code = action.dataset.code;
      const qty = getNum('pkg-adjust-qty');
      const note = getVal('pkg-adjust-note').trim();
      if(qty===null || qty<0){ showToast('請輸入大於等於 0 的數量'); return; }
      actionAdjustPackagedStock(code, qty, note).then(()=>{ uiState.pkgAdjustModal=null; render(); });
    }
    else if(act==='open-drink-edit'){
      uiState.drinkEditModal = action.dataset.title; render();
    }
    else if(act==='close-drink-edit'){
      uiState.drinkEditModal = null; render();
    }
    else if(act==='add-edit-ingredient-row'){
      const wrap = document.getElementById('ed-ingredients');
      const idx = wrap.querySelectorAll('.ing-input-row').length;
      wrap.insertAdjacentHTML('beforeend', `
        <div class="ing-input-row" data-idx="${idx}">
          <input type="text" class="ed-ing-name" list="ed-material-list" placeholder="材料名稱">

          <button class="btn btn-sm btn-ghost" data-action="remove-edit-ingredient-row" data-idx="${idx}">移除</button>
        </div>`);
    }
    else if(act==='remove-edit-ingredient-row'){
      const row = action.closest('.ing-input-row');
      if(row) row.remove();
    }
    else if(act==='save-drink-edit'){
      const title = action.dataset.title;
      const ingredients = [];
      document.querySelectorAll('#ed-ingredients .ing-input-row').forEach(row=>{
        const name = row.querySelector('.ed-ing-name').value.trim();
        const amount = parseFloat(row.querySelector('.ed-ing-amount').value);
        const unit = row.querySelector('.ed-ing-unit').value;
        if(name && !isNaN(amount)) ingredients.push({name, amount, unit});
      });
      if(!ingredients.length){ showToast('至少要有一項材料'); return; }
      actionUpdateDrinkIngredients(title, ingredients).then(()=>{ uiState.drinkEditModal=null; render(); });
    }
    else if(act==='save-drink-title'){
      const oldTitle = action.dataset.title;
      const newTitle = getVal('ed-drink-title');
      actionRenameDrink(oldTitle, newTitle);
    }
    else if(act==='log-filter'){
      logFilter = action.dataset.type; render();
    }
    else if(act==='ql-submit'){
      const type = action.dataset.type;
      const map = {
        '入庫': ['ql-in-name','ql-in-qty','ql-in-note'],
        '出庫': ['ql-out-name','ql-out-qty','ql-out-note'],
        '報廢': ['ql-scrap-name','ql-scrap-qty','ql-scrap-note'],
        '調整': ['ql-adj-name','ql-adj-qty','ql-adj-note'],
      };
      const [nameId, qtyId, noteId] = map[type];
      const name = getVal(nameId).trim();
      const qty = getNum(qtyId);
      const note = getVal(noteId).trim();
      if(!name || !findMaterial(name)){ showToast('請輸入正確的材料名稱'); return; }
      if(qty===null){ showToast('請輸入數量'); return; }
      if(type==='調整'){ if(qty<0){ showToast('請輸入大於等於 0 的數量'); return; } }
      else if(qty<=0){ showToast('請輸入大於 0 的數量'); return; }
      if(type==='入庫') actionRestock(name, qty, note);
      else if(type==='出庫') actionManualOut(name, qty, note);
      else if(type==='報廢') actionScrap(name, qty, note);
      else if(type==='調整') actionAdjust(name, qty, note);
    }
  });

  document.body.addEventListener('change', (e)=>{
    const t = e.target;
    if(t.dataset.action==='safety'){
      actionSetSafety(t.dataset.name, parseFloat(t.value)||0);
    }else if(t.dataset.action==='pkg-safety'){
      actionSetPackagedSafety(t.dataset.code, parseFloat(t.value)||0);
    }else if(t.dataset.action==='price'){
      const v = t.value===''? null : parseFloat(t.value);
      actionSetPrice(t.dataset.title, v);
    }
  });

  document.body.addEventListener('input', (e)=>{
    if(e.target.id==='log-search'){
      logSearch = e.target.value;
      render();
      const el = document.getElementById('log-search');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  });

  document.querySelector('.modal-root-click-guard');
}
